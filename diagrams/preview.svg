  <rect x="40" y="272" width="236" height="76" rx="6" fill="#0d0d0f"/>
  <rect x="40" y="272" width="236" height="76" rx="6" fill="#17171a" stroke="rgba(245,245,245,0.28)" stroke-width="1"/>
  <rect x="48" y="278" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.3)" stroke-width=".8"/>
