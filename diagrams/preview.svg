  <text x="324" y="163" fill="#8a8a92" font-size="7" font-family="Menlo, monospace" text-anchor="middle" letter-spacing=".08em">PRE</text>
  <text x="450" y="182" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Thonburi, sans-serif" text-anchor="middle">เตรียมภาพ</text>
  <text x="450" y="198" fill="#8a8a92" font-size="9" font-family="Menlo, monospace" text-anchor="middle">768px · frame diff</text>

