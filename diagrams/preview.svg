  <!-- 1 กล้อง -->
  <rect x="370" y="48" width="160" height="52" rx="6" fill="#0d0d0f"/>
  <rect x="370" y="48" width="160" height="52" rx="6" fill="rgba(245,245,245,0.06)" stroke="#5a5a63" stroke-width="1"/>
  <rect x="378" y="54" width="24" height="12" rx="2" fill="transparent" stroke="rgba(90,90,99,0.7)" stroke-width=".8"/>
  <text x="390" y="63" fill="#8a8a92" font-size="7" font-family="Menlo, monospace" text-anchor="middle" letter-spacing=".08em">IN</text>
