  <text x="450" y="690" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Thonburi, sans-serif" text-anchor="middle">จัดลำดับก่อนพูด</text>
  <text x="450" y="706" fill="#8a8a92" font-size="9" font-family="Menlo, monospace" text-anchor="middle">danger first</text>

  <!-- 9 เสียง → ผู้ใช้ — FOCAL -->
  <rect x="280" y="760" width="340" height="72" rx="6" fill="#0d0d0f"/>
  <rect x="280" y="760" width="340" height="72" rx="6" fill="rgba(255,176,32,0.12)" stroke="#ffb020" stroke-width="1"/>
  <rect x="288" y="766" width="32" height="12" rx="2" fill="transparent" stroke="rgba(255,176,32,0.5)" stroke-width=".8"/>
  <text x="304" y="775" fill="#ffb020" font-size="7" font-family="Menlo, monospace" text-anchor="middle" letter-spacing=".08em">OUT</text>
  <text x="450" y="800" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Thonburi, sans-serif" text-anchor="middle">พูดให้ผู้ใช้ฟัง</text>
  <text x="450" y="818" fill="#ffb020" font-size="9" font-family="Menlo, monospace" text-anchor="middle">edge-tts · th-TH-Niwat</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="864" x2="860" y2="864" stroke="rgba(245,245,245,0.12)" stroke-width=".8"/>
  <text x="40" y="884" fill="#8a8a92" font-size="8" font-family="Menlo, monospace" letter-spacing=".14em">LEGEND</text>

  <rect x="140" y="876" width="12" height="10" rx="2" fill="rgba(245,245,245,0.06)" stroke="#5a5a63" stroke-width="1"/>
  <text x="160" y="884" fill="#8a8a92" font-size="9" font-family="Thonburi, sans-serif">อินพุต</text>

  <rect x="260" y="876" width="12" height="10" rx="2" fill="#17171a" stroke="rgba(245,245,245,0.28)" stroke-width="1"/>
  <text x="280" y="884" fill="#8a8a92" font-size="9" font-family="Thonburi, sans-serif">ขั้นประมวลผล</text>

  <rect x="420" y="876" width="12" height="10" rx="2" fill="rgba(255,176,32,0.12)" stroke="#ffb020" stroke-width="1"/>
  <text x="440" y="884" fill="#8a8a92" font-size="9" font-family="Thonburi, sans-serif">จุดสำคัญของระบบ</text>

  <line x1="620" y1="881" x2="648" y2="881" stroke="#ffb020" stroke-width="1.2"/>
  <text x="656" y="884" fill="#8a8a92" font-size="9" font-family="Thonburi, sans-serif">เส้นทางที่ทำให้ต่างจากการบอกแค่ว่าเห็นอะไร</text>
</svg>