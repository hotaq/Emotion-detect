<svg viewBox="0 0 900 920" role="img" aria-labelledby="henjai-architecture-title henjai-architecture-desc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="henjai-architecture-title">สถาปัตยกรรมระบบเห็นใจ</title>
  <desc id="henjai-architecture-desc">แผนผังระบบผู้ช่วยการมองเห็น ภาพจากกล้องผ่านการเตรียมภาพ แล้วแยกอ่านสามด้านพร้อมกันคืออารมณ์ ภาษากาย และสภาพแวดล้อม ผลทั้งสามรวมที่จุดรวมบริบท ส่งต่อให้โมเดลภาษาเรียบเรียงเป็นประโยค ผ่านตัวจัดลำดับความสำคัญที่ดันเรื่องอันตรายขึ้นก่อน แล้วอ่านออกเป็นเสียงไทยให้ผู้ใช้</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a8a92"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffb020"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0d0d0f"/>

  <!-- ===== arrows (drawn before boxes) ===== -->
  <line x1="450" y1="100" x2="450" y2="148" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- fan out -->
  <path d="M 375,208 V 232 Q 375,240 367,240 H 166 Q 158,240 158,248 V 272"
        fill="none" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="208" x2="450" y2="272" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 525,208 V 232 Q 525,240 533,240 H 734 Q 742,240 742,248 V 272"
        fill="none" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- fan in -->
  <path d="M 158,348 V 376 Q 158,384 166,384 H 367 Q 375,384 375,392 V 420"
        fill="none" stroke="#ffb020" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="450" y1="348" x2="450" y2="420" stroke="#ffb020" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M 742,348 V 376 Q 742,384 734,384 H 533 Q 525,384 525,392 V 420"
        fill="none" stroke="#ffb020" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <line x1="450" y1="488" x2="450" y2="552" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="612" x2="450" y2="656" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="716" x2="450" y2="760" stroke="#8a8a92" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== arrow labels (mask + 10px side gap on vertical segments) ===== -->
  <rect x="460" y="116" width="56" height="12" rx="2" fill="#0d0d0f"/>
  <text x="488" y="125" fill="#8a8a92" font-size="8" font-family="Menlo, monospace"
        text-anchor="middle" letter-spacing=".06em">30 FPS</text>

  <rect x="460" y="512" width="56" height="12" rx="2" fill="#0d0d0f"/>
  <text x="488" y="521" fill="#8a8a92" font-size="8" font-family="Menlo, monospace"
        text-anchor="middle" letter-spacing=".06em">2.2 S</text>

  <rect x="460" y="730" width="56" height="12" rx="2" fill="#0d0d0f"/>
  <text x="488" y="739" fill="#8a8a92" font-size="8" font-family="Menlo, monospace"
        text-anchor="middle" letter-spacing=".06em">0.9 S</text>

