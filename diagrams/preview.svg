  <text x="450" y="330" fill="#8a8a92" font-size="9" font-family="Menlo, monospace" text-anchor="middle">YOLO11-Pose</text>

  <!-- 5 อ่านสภาพแวดล้อม -->
  <rect x="624" y="272" width="236" height="76" rx="6" fill="#0d0d0f"/>
  <rect x="624" y="272" width="236" height="76" rx="6" fill="#17171a" stroke="rgba(245,245,245,0.28)" stroke-width="1"/>
  <rect x="632" y="278" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.3)" stroke-width=".8"/>
  <text x="644" y="287" fill="#8a8a92" font-size="7" font-family="Menlo, monospace" text-anchor="middle" letter-spacing=".08em">03</text>
  <text x="742" y="312" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Thonburi, sans-serif" text-anchor="middle">อ่านสภาพแวดล้อม</text>
  <text x="742" y="330" fill="#8a8a92" font-size="9" font-family="Menlo, monospace" text-anchor="middle">YOLO11</text>

  <!-- 6 รวมบริบท — FOCAL -->
  <rect x="300" y="420" width="300" height="68" rx="6" fill="#0d0d0f"/>
  <rect x="300" y="420" width="300" height="68" rx="6" fill="rgba(255,176,32,0.12)" stroke="#ffb020" stroke-width="1"/>
  <rect x="308" y="426" width="40" height="12" rx="2" fill="transparent" stroke="rgba(255,176,32,0.5)" stroke-width=".8"/>
  <text x="328" y="435" fill="#ffb020" font-size="7" font-family="Menlo, monospace" text-anchor="middle" letter-spacing=".08em">FUSE</text>
  <text x="450" y="458" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Thonburi, sans-serif" text-anchor="middle">รวมเป็นบริบทเดียว</text>
  <text x="450" y="476" fill="#ffb020" font-size="9" font-family="Menlo, monospace" text-anchor="middle">context fusion</text>

  <!-- 7 เรียบเรียง -->
  <rect x="300" y="552" width="300" height="60" rx="6" fill="#0d0d0f"/>
  <rect x="300" y="552" width="300" height="60" rx="6" fill="#17171a" stroke="rgba(245,245,245,0.28)" stroke-width="1"/>
  <rect x="308" y="558" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.3)" stroke-width=".8"/>
  <text x="322" y="567" fill="#8a8a92" font-size="7" font-family="Menlo, monospace" text-anchor="middle" letter-spacing=".08em">LLM</text>
  <text x="450" y="586" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Thonburi, sans-serif" text-anchor="middle">เรียบเรียงเป็นประโยค</text>
  <text x="450" y="602" fill="#8a8a92" font-size="9" font-family="Menlo, monospace" text-anchor="middle">gemini-3.1-flash-lite</text>

  <!-- 8 จัดลำดับ -->
  <rect x="320" y="656" width="260" height="60" rx="6" fill="#0d0d0f"/>
