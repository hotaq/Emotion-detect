  <title id="henjai-1920-title">HENJAI system architecture</title>
  <desc id="henjai-1920-desc">A camera feed passes through pre-processing, then splits into three parallel readings — facial emotion, body language, and environment. The three results merge at a context fusion step, which feeds a language model that writes one sentence, a priority filter that puts danger first, and finally Thai speech delivered to the user.</desc>

  <text x="104" y="196" fill="#6b6b76" font-size="20" font-family="'Geist', sans-serif">One camera. Three readings in parallel. Merged back into a single sentence a blind user can act on.</text>
